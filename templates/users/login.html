{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Login" %} | Kalkan Nilüfer Butik{% endblock %}

{% block content %}
<section class="page form-page">
    <h1>{% trans "Login" %}</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="form-row">
            <label for="id_username">{% trans "Username" %}</label>
            <input type="text" name="username" id="id_username" required>
        </div>
        <div class="form-row">
            <label for="id_password">{% trans "Password" %}</label>
            <div class="password-field">
                <input type="password" name="password" id="id_password" required>
                <button type="button" class="password-toggle" data-target="id_password" aria-label="Toggle password visibility">
                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-closed-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit">{% trans "Login" %}</button>
    </form>
    <p>{% trans "Don’t have an account?" %} <a href="{% url 'users:register' %}">{% trans "Register" %}</a></p>
</section>
{% endblock %}
